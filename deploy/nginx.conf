# 石境反向代理（Nginx）—— 供偏好 Nginx + certbot 的部署路径使用。
#
# 把 yourdomain.com 替换为你的域名。证书流程：
#   1) 先用下面的 HTTP server（注释掉 443 段）启动，让 certbot 走 webroot 验证；
#   2) certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
#   3) 解开 443 段并 reload。
# 或直接使用 `certbot --nginx` 自动改写配置。

# ---------- HTTP：certbot webroot 验证 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：反向代理到应用 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # 健康检查直通
    location = /health/live  { proxy_pass http://app:8000; }
    location = /health/ready { proxy_pass http://app:8000; }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        # SSE 流式关键：关闭缓冲，否则 /chat 的流式输出会被攒起来一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # 透传请求 ID、真实客户端 IP、协议与主机名
        # 客户端未传 X-Request-ID 时为空值，应用会自行生成
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # 效果图生成最长约 240 秒，超时给足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
