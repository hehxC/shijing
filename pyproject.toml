[project]
name = "langchain-project-one"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "langchain>=1.3.4",
    "langchain-agent>=0.1.1",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "python-dotenv>=1.2.2",
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.49.0",
    "xhs>=0.2.13",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.5",
    "alembic>=1.19.0",
    "dashscope>=1.26.6",
    "pillow>=12.0.0",
    "boto3>=1.40.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.20.0",
    "lupa>=2.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
